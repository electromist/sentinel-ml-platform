services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  jupyter-spark:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter-spark
    ports:
      - "8888:8888" # Jupyter Lab
      - "4040:4040" # Spark Job UI
    environment:
      - JUPYTER_TOKEN=easytoken # Login password
    volumes:
      - ./data-pipeline/spark:/home/jovyan/work # Code sync hoga
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1 # Zaroori hai kuch networks ke liye

  model-serving:
    image: python:3.9-slim
    container_name: model-serving
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./model-serving:/app
    command: sh -c "pip install fastapi uvicorn && uvicorn api.main:app --host 0.0.0.0 --reload"
